<tal:block tal:define="
    raw_abs python:node.get('absolute-level') or node.get('absolute_level');
    hlevel python:raw_abs if raw_abs is not None else (node.get('level', 1) + 1);
    hlevel python:hlevel if hlevel <= 6 else 6;
    hlevel python:hlevel if hlevel >= 1 else 1;
    sec_level python:node.get('level', 1);
"><section tal:attributes="id node.get('attributes', {}).get('id'); class python:'adoc-section level-' + str(sec_level)"><tal:block tal:define="t node.get('title', [])"><h1 tal:condition="python: hlevel == 1"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h1><h2 tal:condition="python: hlevel == 2"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h2><h3 tal:condition="python: hlevel == 3"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h3><h4 tal:condition="python: hlevel == 4"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h4><h5 tal:condition="python: hlevel == 5"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h5><h6 tal:condition="python: hlevel >= 6"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h6></tal:block><div class="section-blocks" tal:condition="node.get('blocks')"><tal:block tal:repeat="block node.get('blocks', [])" tal:replace="structure renderer.render(block, ctx)" /></div></section></tal:block>
