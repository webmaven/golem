<tal:block tal:define="
    raw_abs python:node.get('absolute-level') or node.get('absolute_level');
    hlevel python:raw_abs if raw_abs is not None else (node.get('level', 1) + 1);
    hlevel python:hlevel if hlevel <= 6 else 6;
    hlevel python:hlevel if hlevel >= 1 else 1;
    sec_level python:node.get('level', 1);
    role python:node.get('attributes', {}).get('role', '');
    sec_class python:'adoc-section level-' + str(sec_level) + (' ' + role if role else '');
    glyph python:node.get('attributes', {}).get('glyph');
    pills python:node.get('attributes', {}).get('pills') or [];
"><section tal:attributes="id node.get('attributes', {}).get('id'); class sec_class"><tal:block tal:define="t node.get('title', [])"><div class="doc-title-row" tal:omit-tag="python:not glyph and not pills"><span class="symbol-glyph" tal:condition="python:glyph" tal:attributes="class python:'symbol-glyph ' + glyph['css_class']; aria-label glyph['label']" tal:content="glyph['letter']" /><h1 tal:condition="python: hlevel == 1"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h1><h2 tal:condition="python: hlevel == 2"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h2><h3 tal:condition="python: hlevel == 3"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h3><h4 tal:condition="python: hlevel == 4"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h4><h5 tal:condition="python: hlevel == 5"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h5><h6 tal:condition="python: hlevel >= 6"><tal:block tal:repeat="inline t" tal:replace="structure renderer.render(inline, ctx)" /></h6><span class="pill" tal:condition="python:pills" tal:repeat="pill pills" tal:attributes="class python:'pill ' + pill['css_class']; title pill['title']" tal:content="pill['text']" /></div></tal:block><div class="section-blocks" tal:condition="node.get('blocks')"><tal:block tal:repeat="block node.get('blocks', [])" tal:replace="structure renderer.render(block, ctx)" /></div></section></tal:block>
