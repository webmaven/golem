repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        require_serial: true
