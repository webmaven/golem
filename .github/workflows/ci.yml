name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Both OSes are required. `ubuntu-latest` alone cannot see locale-dependent
  # text I/O (cp1252 vs UTF-8), text-mode newline translation, or POSIX-only
  # path assumptions -- the exact classes that let 17 Windows-only failures
  # reach a merged `main`.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Check formatting with ruff
      run: |
        ruff format --check .

    - name: Run tests
      run: |
        pytest
