[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golem-docs"
version = "0.1.0a3"
description = "A static site generator built on AsciiDoc, designed for highly technical interactive documentation."
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Michael Bernstein" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "asciidoctrine>=0.2.0a8",
    "asciidocstring>=0.1.0a11",
    "asciidoctest>=0.2.0a6",
    "asciidoctype>=0.1.0a7",
    "chameleon",
    "click",
    "filelock",
    "pluggy",
    "pygments>=2.18",
    "griffe>=1.5.0",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/webmaven/golem"
Documentation = "https://webmaven.github.io/golem/"
Repository = "https://github.com/webmaven/golem.git"
Issues = "https://github.com/webmaven/golem/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "coverage[toml]",
    "ruff",
    "mypy",
    "requests",
]
docs = [
    "golem-docs",  # self-hosting: use golem itself to build golem's docs
]

[project.scripts]
golem = "golem.cli:main"

[project.entry-points."golem.plugins"]
doctest = "golem.plugins.doctest"
apidoc = "golem.plugins.apidoc"
source_links = "golem.plugins.source_links:SourceLinksPlugin"
nav_helpers = "golem.plugins.nav_helpers:NavigationHelpersPlugin"
index = "golem.plugins.index_glossary:IndexPlugin"
glossary = "golem.plugins.index_glossary:GlossaryPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/golem"]

[tool.golem.site]
title = "Golem Documentation"
author = "Michael Bernstein"

[tool.golem.build]
content_dir = "docs"
output_dir = "dist"
theme = "default"

[tool.golem.plugins]
plugins = [
    "golem.plugins.apidoc",
    "golem.plugins.doctest",
    "golem.plugins.source_links:SourceLinksPlugin",
    "golem.plugins.nav_helpers:NavigationHelpersPlugin",
    "golem.plugins.index_glossary:GlossaryPlugin",
]

[tool.golem.plugins.source_links]
branch = "main"
docs_dir = "docs"

[tool.golem.plugins.nav_helpers]
home_title = "Home"

[tool.golem.api]
packages = ["golem"]
output_dir = "api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4 --ignore=ARCHITECTURE.adoc --ignore=docs"


[tool.ruff]
line-length = 127
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["C901", "E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/golem"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70


