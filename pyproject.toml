[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golem-pub"
version = "0.1.0a1"
description = "A static site generator built on AsciiDoc, designed for highly technical interactive documentation."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Michael Bernstein" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "asciidoctrine>=0.1.0a8",
    "asciidocstring>=0.1.0a3",
    "asciidoctest>=0.1.0a3",
    "chameleon",
    "pluggy",
    "pdoc",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/webmaven/golem"
Documentation = "https://webmaven.github.io/golem/"
Repository = "https://github.com/webmaven/golem.git"
Issues = "https://github.com/webmaven/golem/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "mypy",
    "requests",
]
docs = [
    "golem-pub",
]

[project.scripts]
golem = "golem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golem"]


[tool.golem.site]
title = "Golem Documentation"
author = "Michael Bernstein"

[tool.golem.build]
content_dir = "docs"
output_dir = "dist"
theme = "default"


