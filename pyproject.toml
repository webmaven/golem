[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golem-docs"
version = "0.1.0a1"
description = "A static site generator built on AsciiDoc, designed for highly technical interactive documentation."
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Michael Bernstein" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "asciidoctrine>=0.2.0a1",
    "asciidocstring>=0.1.0a6",
    "asciidoctest>=0.2.0a2",
    "asciidoctype>=0.1.0a2",
    "chameleon",
    "click",
    "pluggy",
    "griffe>=1.5.0",
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/webmaven/golem"
Documentation = "https://webmaven.github.io/golem/"
Repository = "https://github.com/webmaven/golem.git"
Issues = "https://github.com/webmaven/golem/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "requests",
]
docs = []

[project.scripts]
golem = "golem.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golem"]

[tool.golem.site]
title = "Golem Documentation"
author = "Michael Bernstein"

[tool.golem.build]
content_dir = "docs"
output_dir = "dist"
theme = "default"

[tool.golem.plugins]
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=SPECIFICATION.adoc --ignore=docs"

[tool.ruff]
line-length = 127
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["C901", "E501"]

[tool.ruff.format]
quote-style = "double"



